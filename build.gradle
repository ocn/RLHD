def hostOs = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT)
def hostArch = System.getProperty('os.arch').toLowerCase(java.util.Locale.ROOT)
def vulkanOffscreenNativeClassifier = hostOs.contains('mac') ?
	(hostArch in ['aarch64', 'arm64'] ? 'natives-macos-arm64' : 'natives-macos') :
	hostOs.contains('win') ? (hostArch in ['aarch64', 'arm64'] ? 'natives-windows-arm64' : 'natives-windows') :
	(hostArch in ['aarch64', 'arm64'] ? 'natives-linux-arm64' : 'natives-linux')
dependencies.add('vulkanOffscreenSliceRuntimeOnly', "org.lwjgl:lwjgl:3.3.2:${vulkanOffscreenNativeClassifier}")

def macSurfaceSpikeDir = file('spikes/macos-surface')
def macSurfaceNativeDir = layout.buildDirectory.dir('spikes/macos-surface/native')
def macSurfaceNativeLibrary = macSurfaceNativeDir.map { it.file('librlhd_mac_surface.dylib') }
def macSurfaceNativeTestBinary = macSurfaceNativeDir.map { it.file('surface_state_test') }
def metalControlSpikeDir = file('spikes/metal-control')
def metalControlNativeDir = layout.buildDirectory.dir('spikes/metal-control/native')
def metalControlNativeLibrary = metalControlNativeDir.map { it.file('librlhd_metal_control.dylib') }
def vulkanControlSpikeDir = file('spikes/vulkan-control')
def vulkanControlShaderOutputDir = layout.buildDirectory.dir('generated/spikes/vulkan-control/resources')
def vulkanControlShaderNames = ['triangle.vert', 'triangle.frag', 'ui.vert', 'ui.frag']
def vulkanOpaqueSliceDir = file('spikes/vulkan-opaque-slice')
def vulkanOpaqueSliceOutputDir = layout.buildDirectory.dir('generated/spikes/vulkan-opaque-slice/resources')
def vulkanOpaqueSliceShaderNames = ['opaque.vert', 'opaque.frag', 'ui.vert', 'ui.frag']
def rendererHeadfulAcknowledgement = 'I_ACCEPT_KERNEL_PANIC_RISK'
def vulkanLiveRiskLevels = ['surface-swapchain', 'first-fifo-present', 'sustained-fifo',
	'resize-suspend-restore', 'unlocked-present', 'fullscreen']
def rendererCrashJournalFile = layout.projectDirectory.file('docs/renderer/panic-investigation-runs.jsonl')
def requireRendererHeadfulAcknowledgement = { task ->
	def supplied = providers.gradleProperty('rendererHeadfulAcknowledgement').orNull
	if (supplied != rendererHeadfulAcknowledgement) {
		throw new GradleException("${task.path} creates a native presentation surface and is blocked by default. " +
			"Run CPU-only checks instead. To override after reviewing the host risk, pass " +
			"-PrendererHeadfulAcknowledgement=${rendererHeadfulAcknowledgement}.")
	}
}
def requireVulkanLiveRiskLevel = { task ->
	def supplied = providers.gradleProperty('vulkanLiveRiskLevel').orNull
	if (!vulkanLiveRiskLevels.contains(supplied)) {
		throw new GradleException("${task.path} requires exactly one Vulkan live risk rung via " +
			"-PvulkanLiveRiskLevel=<${vulkanLiveRiskLevels.join('|')}>. No rung is selected by default.")
	}
	task.systemProperty 'rlhd.spike.vulkan.riskLevel', supplied
	task.systemProperty 'rlhd.spike.vulkan.validation', 'true'
}

sourceSets.vulkanControlSpike.resources.srcDir(vulkanControlShaderOutputDir)
sourceSets.vulkanOpaqueSlice.resources.srcDir(vulkanOpaqueSliceOutputDir)

def vulkanOpaqueSliceShaderTasks = []
vulkanOpaqueSliceShaderNames.each { shaderName ->
	def taskSuffix = shaderName.split('\\.').collect { it.capitalize() }.join('')
	def sourceFile = file("${vulkanOpaqueSliceDir}/src/main/shaders/${shaderName}")
	def outputFile = vulkanOpaqueSliceOutputDir.map { it.file("shaders/vulkan-opaque-slice/${shaderName}.spv") }
	def reflectionFile = vulkanOpaqueSliceOutputDir.map { it.file("shaders/vulkan-opaque-slice/${shaderName}.reflect.json") }
	def compileTask = tasks.register("compileVulkanOpaqueSlice${taskSuffix}", Exec) {
		group = 'build'
		description = "Compiles ${shaderName} for the offline Vulkan opaque-zone contract."
		inputs.file(sourceFile)
		outputs.file(outputFile)
		doFirst {
			outputFile.get().asFile.parentFile.mkdirs()
			def sdk = System.getenv('RLHD_VULKAN_SDK')
			def compiler = sdk == null || sdk.isEmpty() ? 'glslangValidator' : file("${sdk}/bin/glslangValidator").absolutePath
			commandLine compiler, '--target-env', 'vulkan1.2', '-V', sourceFile.absolutePath, '-o', outputFile.get().asFile.absolutePath
		}
	}
	def validateTask = tasks.register("validateVulkanOpaqueSlice${taskSuffix}", Exec) {
		group = 'verification'
		description = "Validates offline ${shaderName} SPIR-V for Vulkan 1.2."
		dependsOn compileTask
		inputs.file(outputFile)
		doFirst {
			def sdk = System.getenv('RLHD_VULKAN_SDK')
			def validator = sdk == null || sdk.isEmpty() ? 'spirv-val' : file("${sdk}/bin/spirv-val").absolutePath
			commandLine validator, '--target-env', 'vulkan1.2', outputFile.get().asFile.absolutePath
		}
	}
	def reflectTask = tasks.register("reflectVulkanOpaqueSlice${taskSuffix}", Exec) {
		group = 'verification'
		description = "Writes deterministic JSON reflection for offline ${shaderName} SPIR-V."
		dependsOn compileTask
		inputs.file(outputFile)
		outputs.file(reflectionFile)
		doFirst {
			def sdk = System.getenv('RLHD_VULKAN_SDK')
			def reflector = sdk == null || sdk.isEmpty() ? 'spirv-cross' : file("${sdk}/bin/spirv-cross").absolutePath
			commandLine reflector, outputFile.get().asFile.absolutePath, '--reflect', '--output', reflectionFile.get().asFile.absolutePath
		}
		doLast {
			def reflected = new groovy.json.JsonSlurper().parse(reflectionFile.get().asFile)
			def scalarSizes = [float: 4, int: 4, uint: 4, vec2: 8, ivec2: 8, uvec2: 8,
				vec3: 12, ivec3: 12, uvec3: 12, vec4: 16, ivec4: 16, uvec4: 16, mat4: 64]
			reflected.push_constants?.each { block ->
				def members = reflected.types[block.type].members
				block.block_size = members.collect { member -> member.offset + scalarSizes[member.type] }.max()
			}
			reflectionFile.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(reflected)) + '\n'
		}
	}
	vulkanOpaqueSliceShaderTasks.add(validateTask)
	vulkanOpaqueSliceShaderTasks.add(reflectTask)
}

tasks.register('validateVulkanOpaqueSliceShaders') {
	group = 'verification'
	description = 'Compiles, validates, and reflects all four offline Vulkan opaque-slice shaders.'
	dependsOn vulkanOpaqueSliceShaderTasks
}

tasks.named(sourceSets.vulkanOpaqueSlice.processResourcesTaskName) {
	dependsOn tasks.named('validateVulkanOpaqueSliceShaders')
}

