plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = '1.12.+'
def pluginMainClass = 'rs117.hd.HdPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.mockito:mockito-core:3.1.0'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion

	testCompileOnly 'org.projectlombok:lombok:1.18.30'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

sourceSets {
	macSurfaceSpike {
		java.srcDir 'spikes/macos-surface/src/main/java'
	}
	macSurfaceSpikeTest {
		java.srcDir 'spikes/macos-surface/src/test/java'
		compileClasspath += sourceSets.macSurfaceSpike.output
		runtimeClasspath += output + compileClasspath
	}
	metalControlSpike {
		java.srcDir 'spikes/metal-control/src/main/java'
		compileClasspath += sourceSets.macSurfaceSpike.output
		runtimeClasspath += output + sourceSets.macSurfaceSpike.output + compileClasspath
	}
	metalControlSpikeTest {
		java.srcDir 'spikes/metal-control/src/test/java'
		compileClasspath += sourceSets.macSurfaceSpike.output + sourceSets.metalControlSpike.output
		runtimeClasspath += output + compileClasspath + sourceSets.metalControlSpike.runtimeClasspath
	}
	vulkanControlSpike {
		java.srcDir 'spikes/vulkan-control/src/main/java'
		compileClasspath += sourceSets.macSurfaceSpike.output + sourceSets.metalControlSpike.output
		runtimeClasspath += output + sourceSets.macSurfaceSpike.output + sourceSets.metalControlSpike.output + compileClasspath
	}
	vulkanControlSpikeTest {
		java.srcDir 'spikes/vulkan-control/src/test/java'
		compileClasspath += sourceSets.macSurfaceSpike.output + sourceSets.metalControlSpike.output + sourceSets.vulkanControlSpike.output
		runtimeClasspath += output + compileClasspath + sourceSets.vulkanControlSpike.runtimeClasspath
	}
	vulkanOpaqueSlice {
		java.srcDir 'spikes/vulkan-opaque-slice/src/main/java'
		compileClasspath += sourceSets.main.output
		runtimeClasspath += output + sourceSets.main.output + compileClasspath
	}
	vulkanOpaqueSliceTest {
		java.srcDir 'spikes/vulkan-opaque-slice/src/test/java'
		compileClasspath += sourceSets.main.output + sourceSets.vulkanOpaqueSlice.output
		runtimeClasspath += output + compileClasspath + sourceSets.vulkanOpaqueSlice.runtimeClasspath
	}
	vulkanOffscreenSlice {
		java.srcDir 'spikes/vulkan-offscreen-slice/src/main/java'
		compileClasspath += sourceSets.main.output + sourceSets.vulkanOpaqueSlice.output
		runtimeClasspath += output + sourceSets.main.output + sourceSets.vulkanOpaqueSlice.output + compileClasspath
	}
	vulkanOffscreenSliceTest {
		java.srcDir 'spikes/vulkan-offscreen-slice/src/test/java'
		compileClasspath += sourceSets.main.output + sourceSets.vulkanOpaqueSlice.output + sourceSets.vulkanOffscreenSlice.output
		runtimeClasspath += output + compileClasspath + sourceSets.vulkanOffscreenSlice.runtimeClasspath
	}
}

configurations {
	macSurfaceSpikeTestImplementation.extendsFrom testImplementation
	macSurfaceSpikeTestRuntimeOnly.extendsFrom testRuntimeOnly
	metalControlSpikeTestImplementation.extendsFrom metalControlSpikeImplementation
	vulkanControlSpikeTestImplementation.extendsFrom vulkanControlSpikeImplementation
	vulkanOpaqueSliceTestImplementation.extendsFrom testImplementation
	vulkanOffscreenSliceTestImplementation.extendsFrom vulkanOffscreenSliceImplementation
}

