	description = 'Runs deterministic CPU-only tests for the isolated Vulkan opaque-zone contract.'
	testClassesDirs = sourceSets.vulkanOpaqueSliceTest.output.classesDirs
	classpath = sourceSets.vulkanOpaqueSliceTest.runtimeClasspath
	exclude '**/*IntegrationTest.class'
