	def outputFile = vulkanControlShaderOutputDir.map { it.file("shaders/vulkan-control/${shaderName}.spv") }
	def compileTask = tasks.register("compileVulkanControl${taskSuffix}", Exec) {
		group = 'build'
		description = "Compiles ${shaderName} for the opt-in Vulkan control spike."
		inputs.file(sourceFile)
		outputs.file(outputFile)
		doFirst {
			outputFile.get().asFile.parentFile.mkdirs()
			def sdk = System.getenv('RLHD_VULKAN_SDK')
			def validator = sdk == null || sdk.isEmpty() ? 'glslangValidator' : file("${sdk}/bin/glslangValidator").absolutePath
			commandLine validator, '--target-env', 'vulkan1.2', '-V', sourceFile.absolutePath, '-o', outputFile.get().asFile.absolutePath
		}
	}
	def validateTask = tasks.register("validateVulkanControl${taskSuffix}", Exec) {
