tasks.register('validateVulkanOpaqueSliceReflection', JavaExec) {
	group = 'verification'
	description = 'Parses and validates the exact interfaces of all four offline Vulkan shaders.'
	dependsOn tasks.named(sourceSets.vulkanOpaqueSlice.classesTaskName)
	classpath = sourceSets.vulkanOpaqueSlice.runtimeClasspath
	mainClass = 'rs117.hd.spikes.vulkan.opaque.VulkanReflectionContract'
	doFirst {
		args = vulkanOpaqueSliceShaderNames.collect { shaderName ->
			vulkanOpaqueSliceOutputDir.get().file("shaders/vulkan-opaque-slice/${shaderName}.reflect.json").asFile.absolutePath
		}
	}
}

tasks.register('vulkanOpaqueSliceJar', Jar) {
	group = BasePlugin.BUILD_GROUP
	description = 'Builds the isolated offline Vulkan opaque-zone contract artifact.'
	dependsOn sourceSets.vulkanOpaqueSlice.classesTaskName
	archiveClassifier.set('vulkan-opaque-slice')
	from sourceSets.vulkanOpaqueSlice.output
}

tasks.register('vulkanOpaqueSliceDependencyIsolation', JavaExec) {
	group = 'verification'
	description = 'Proves the offline Vulkan slice and normal production artifact remain isolated.'
	dependsOn tasks.named('jar'), tasks.named('vulkanOpaqueSliceJar'), tasks.named(sourceSets.vulkanOpaqueSlice.classesTaskName)
	classpath = sourceSets.vulkanOpaqueSlice.runtimeClasspath
	mainClass = 'rs117.hd.spikes.vulkan.opaque.VulkanProductionIsolation'
	doFirst {
		def isolatedDependencies = configurations.vulkanOpaqueSliceRuntimeClasspath.files.findAll { it.isFile() }.collect { it.name }
		if (isolatedDependencies != ['gson-2.14.0.jar']) {
			throw new GradleException("Offline Vulkan slice dependency set is not exact: ${isolatedDependencies}")
		}
		args = [tasks.named('jar').get().archiveFile.get().asFile.absolutePath] +
			configurations.runtimeClasspath.files.collect { it.absolutePath }
	}
}

tasks.register('vulkanOpaqueSliceCheck') {
	group = 'verification'
	description = 'Runs every CPU/offline check for the isolated Vulkan opaque-zone contract.'
