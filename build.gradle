tasks.register('vulkanControlDependencyIsolation') {
	group = 'verification'
	description = 'Checks the Vulkan spike dependency/native boundary without changing production configurations.'
	dependsOn tasks.named('jar'), tasks.named('vulkanControlSpikeJar')
	doLast {
		def names = configurations.vulkanControlSpikeRuntimeClasspath.files.collect { it.name }
		def expected = [
			'gson-2.14.0.jar',
			'lwjgl-3.3.2.jar',
			'lwjgl-vulkan-3.3.2.jar',
			'lwjgl-3.3.2-natives-macos-arm64.jar'
		] as Set
		if (names.size() != expected.size() || names.toSet() != expected) {
			throw new GradleException("Vulkan spike runtime dependency set is not exact: ${names}")
		}
		def productionNames = configurations.runtimeClasspath.files.collect { it.name }
		if (productionNames.any { it.startsWith('lwjgl-') }) {
			throw new GradleException("Vulkan LWJGL leaked into production runtime: ${productionNames}")
		}
		def productionEntries = []
		zipTree(tasks.named('jar').get().archiveFile.get().asFile).visit {
			if (!it.directory) productionEntries.add(it.relativePath.pathString)
		}
		if (productionEntries.any { it.startsWith('rs117/hd/spikes/vulkan/') || it.startsWith('shaders/vulkan-control/') }) {
			throw new GradleException("Vulkan spike leaked into the production jar: ${productionEntries}")
		}
		def spikeEntries = []
		zipTree(tasks.named('vulkanControlSpikeJar').get().archiveFile.get().asFile).visit {
			if (!it.directory) spikeEntries.add(it.relativePath.pathString)
		}
		def unexpected = spikeEntries.findAll {
			it != 'META-INF/MANIFEST.MF' &&
				!it.startsWith('rs117/hd/spikes/vulkan/control/') &&
				!it.startsWith('rs117/hd/spikes/macos/') &&
				!it.startsWith('shaders/vulkan-control/')
		}
		if (!unexpected.isEmpty()) {
			throw new GradleException("Vulkan spike jar contains undeclared paths: ${unexpected}")
		}
	}
}

